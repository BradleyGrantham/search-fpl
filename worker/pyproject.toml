[project]
name = "fpl-api"
version = "0.1.0"
description = "FPL search API as a Cloudflare Python Worker"
requires-python = ">=3.13"
# Standard library only: keeps the bundle tiny and cold starts cheap.
dependencies = [
    "anthropic>=1.12.1",
]

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
